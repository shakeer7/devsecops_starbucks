---
- name: Install GitHub Actions Runner (DevSecOps)
  hosts: runners
  become: yes

  vars:
    runner_version: "2.335.1"
    runner_dir: /opt/actions-runner
    github_url: "https://github.com/shakeer7/devsecops_starbucks"
    runner_token: "PASTE_YOUR_TOKEN_HERE"
    runner_tar: "actions-runner-linux-x64-2.335.1.tar.gz"
    runner_checksum: "4ef2f255f0ae4477f1fe1e346db76d2f3ebf03824e2ddd1973a2819bf6c8cf"

  tasks:

    - name: Install required packages
      apt:
        name:
          - curl
          - tar
          - gzip
          - ca-certificates
        state: present
        update_cache: yes

    - name: Create runner directory
      file:
        path: "{{ runner_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Download GitHub runner
      get_url:
        url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/{{ runner_tar }}"
        dest: "{{ runner_dir }}/{{ runner_tar }}"
        mode: '0644'

    - name: Verify checksum
      shell: |
        echo "{{ runner_checksum }}  {{ runner_tar }}" | sha256sum -c -
      args:
        chdir: "{{ runner_dir }}"

    - name: Extract runner
      unarchive:
        src: "{{ runner_dir }}/{{ runner_tar }}"
        dest: "{{ runner_dir }}"
        remote_src: yes

    - name: Fix permissions
      file:
        path: "{{ runner_dir }}"
        owner: ubuntu
        group: ubuntu
        recurse: yes

    - name: Configure runner (GitHub registration)
      become_user: ubuntu
      shell: |
        ./config.sh --url {{ github_url }} \
        --token {{ runner_token }} \
        --unattended \
        --replace \
        --name "devsecops-runner-1" \
        --work _work
      args:
        chdir: "{{ runner_dir }}"

    - name: Install runner service
      shell: ./svc.sh install
      args:
        chdir: "{{ runner_dir }}"

    - name: Start runner service
      shell: ./svc.sh start
      args:
        chdir: "{{ runner_dir }}"